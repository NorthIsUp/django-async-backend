          async def _batched_insert(
              self,
              objs,
              fields,
              batch_size,
              on_conflict=None,
              update_fields=None,
              unique_fields=None,
          ):
              """
              Helper method for bulk_create() to insert objs one batch at a time.
              """
              connection = async_connections[self.db]
              ops = connection.ops
              max_batch_size = max(ops.bulk_batch_size(fields, objs), 1)
              batch_size = (
                  min(batch_size, max_batch_size) if batch_size else max_batch_size
              )
              inserted_rows = []
              bulk_return = connection.features.can_return_rows_from_bulk_insert
              batches = [
                  objs[i : i + batch_size] for i in range(0, len(objs), batch_size)
              ]
              if len(batches) > 1:
                  context = async_atomic(using=self.db, savepoint=False)
              else:
                  context = nullcontext()
              async with context:
                  for item in batches:
                      inserted_rows.extend(
                          await self._insert(
                              item,
                              fields=fields,
                              using=self.db,
                              on_conflict=on_conflict,
                              update_fields=update_fields,
                              unique_fields=unique_fields,
                              returning_fields=(
                                  self.model._meta.db_returning_fields
                                  if bulk_return
                                  else None
                              ),
                              raw=False,
                          )
                      )
              return inserted_rows
